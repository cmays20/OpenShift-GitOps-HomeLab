apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: local-cluster
spec:
  clusterName: local-cluster
  # Homelab sizing from 48h of per-container peaks (2026-11-16). Limits are the
  # operator defaults, restated because setting resources replaces the whole
  # block. Deployments are pinned off the 28Gi control-plane nodes.
  sensor:
    # was 2 CPU / 4Gi; peak 185m / 2191Mi
    nodeSelector:
      node-role.kubernetes.io/non-master: ''
    resources:
      requests:
        cpu: 250m
        memory: 2560Mi
      limits:
        cpu: '4'
        memory: 8Gi
  admissionControl:
    listenOnCreates: false
    listenOnEvents: true
    listenOnUpdates: false
    # was 3 replicas (2 on masters); peak per pod 1m / 162Mi. The webhook is
    # failurePolicy=Ignore, so a single replica cannot block the API.
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/non-master: ''
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi
  perNode:
    collector:
      collection: EBPF
      imageFlavor: Regular
      # collector itself is fine (320Mi request vs 283Mi peak) - left alone.
    compliance:
      # Under-requested: 10Mi requested vs 285Mi peak per node. Raised so the
      # scheduler accounts for it; this is the one ACS value that goes UP.
      resources:
        requests:
          cpu: 10m
          memory: 320Mi
        limits:
          cpu: '1'
          memory: 2Gi
    taintToleration: TolerateTaints
