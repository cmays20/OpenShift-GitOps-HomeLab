# Note this is resource reduced, this should not be taken as a production ready installation
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: central
spec:
  central:
    # Homelab right-sizing. Operator defaults reserve far more than this cluster
    # ever uses, and the reservation is what blocks other demos from scheduling.
    # Observed steady-state: central 7m CPU / 884Mi, central-db 15m CPU / 1000Mi.
    # Limits are kept well above observed usage to absorb scan/ingest bursts.
    #
    # nodeSelector keeps both pods off the 28Gi control-plane nodes, which are
    # the memory-constrained ones. The label is applied by the node-labels app
    # (Node-Labels/NonMaster), which explains why worker alone is not enough.
    nodeSelector:
      node-role.kubernetes.io/non-master: ''
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi
    db:
      nodeSelector:
        node-role.kubernetes.io/non-master: ''
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: '2'
          memory: 4Gi
    exposure:
      loadBalancer:
        enabled: false
        port: 443
      nodePort:
        enabled: false
      route:
        enabled: true
    persistence:
      persistentVolumeClaim:
        claimName: stackrox-db
  egress:
    connectivityPolicy: Online
  # Scanner v2 block removed 2026-11-16: with the 5.0 operator it deploys no
  # pods even when set to Enabled; Scanner V4 below is the only scanner.
  #
  # Scanner V4 homelab sizing, from 48h of per-container peaks (2026-11-16).
  # Requests are cut to just above peak; limits are the operator defaults,
  # restated because setting resources replaces the whole block.
  # One replica each: a restart pauses scanning for about a minute, which is
  # acceptable here. Everything is pinned off the 28Gi control-plane nodes.
  scannerV4:
    indexer:
      # was 2 x 1500m / 512Mi; peak per pod 15m / 287Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
      nodeSelector:
        node-role.kubernetes.io/non-master: ''
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: '4'
          memory: 3Gi
    matcher:
      # was 2 x 500m / 1536Mi; peak per pod 440m / 558Mi (loading the vuln DB)
      scaling:
        autoScaling: Disabled
        replicas: 1
      nodeSelector:
        node-role.kubernetes.io/non-master: ''
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: '1'
          memory: 3Gi
    db:
      # was 1 CPU / 4Gi. The 7.6Gi working-set "peak" is mostly reclaimable
      # page cache: anon ~217Mi + shared_buffers ~803Mi, the rest file cache.
      # Limit stays 8Gi so Postgres keeps a large cache when memory is free.
      nodeSelector:
        node-role.kubernetes.io/non-master: ''
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: '4'
          memory: 8Gi